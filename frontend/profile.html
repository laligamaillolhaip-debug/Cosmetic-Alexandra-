<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080B12">
  <title>Ядро — твой профиль</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body class="profile-page">
  <div id="topbar" class="topbar"></div>
  <main class="container profile-main">
    <header class="profile-hero">
      <div>
        <p class="profile-kicker"><span class="section-index">01 /</span> Личное пространство</p>
        <h1>Твой профиль<span>.</span></h1>
        <p class="hero-caption">Твоя кожа. Твои потребности. Твой ритм.</p>
      </div>
      <div class="hero-budget" aria-label="Месячный бюджет">
        <span class="profile-label">Бюджет на месяц</span>
        <p><span id="heroBudget">—</span><span class="budget-currency"> ₽</span></p>
        <span class="budget-footnote">Подбор средств в твоих границах</span>
      </div>
    </header>
    <div id="profileContent" class="loading" aria-live="polite">Загружаем твой профиль…</div>
    <footer class="profile-footer">
      <p>ЯДРО <span>/</span> Уход, который подходит тебе</p>
      <button class="profile-logout" id="logoutAccount" type="button">Выйти из аккаунта <span aria-hidden="true">↗</span></button>
    </footer>
  </main>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
