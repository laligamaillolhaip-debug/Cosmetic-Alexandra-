<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — профиль</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .profile-grid{display:grid; grid-template-columns:1fr; gap:18px; align-items:start;}
  @media (min-width:960px){ .profile-grid{grid-template-columns:1fr 1fr;} }

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012));
    border:1px solid var(--border); border-radius:var(--r-xl);
    padding:22px; display:flex; flex-direction:column; gap:16px;
  }
  .panel h2{font-size:17px; display:flex; align-items:center; gap:10px;}
  .panel h2 svg{color:var(--accent);}

  .tag-row{display:flex; gap:9px; flex-wrap:wrap;}
  .tag{
    font-size:13px; font-weight:600; padding:9px 15px; border-radius:var(--r-full);
    background:var(--accent-soft); color:var(--accent); border:1px solid rgba(59,158,255,0.28);
  }
  .tag.plain{background:rgba(255,255,255,0.04); color:var(--text-muted); border-color:var(--border);}
  .field{display:flex; flex-direction:column; gap:9px;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em;}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:11px;}
  .stat{
    padding:16px 12px; text-align:center; border-radius:var(--r-md);
    background:rgba(255,255,255,0.03); border:1px solid var(--border);
  }
  .stat b{display:block; font-family:var(--font-mono); font-size:22px; font-weight:500; color:var(--text);}
  .stat span{font-size:11.5px; color:var(--text-faint); margin-top:4px; display:block; line-height:1.3;}

  .budget-line{display:flex; align-items:baseline; gap:10px;}
  .budget-line b{font-family:var(--font-mono); font-size:28px; font-weight:500;}
  .action-list{display:flex; flex-direction:column; gap:11px;}
  .danger-btn{color:var(--danger); border-color:rgba(248,113,113,0.3);}
  .danger-btn:hover{background:rgba(248,113,113,0.1); border-color:rgba(248,113,113,0.5);}
  .note{font-size:12.5px; color:var(--text-faint); line-height:1.55;}
</style>
</head>
<body>
  <div id="topbar" class="topbar"></div>

  <div class="container">
    <div class="page-head">
      <span class="eyebrow">Твои ответы и настройки</span>
      <h1>Профиль</h1>
    </div>

    <div id="body" class="loading">Загрузка...</div>
  </div>

</body>
</html>
