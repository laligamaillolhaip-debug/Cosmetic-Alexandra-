<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — квиз о коже</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{padding-bottom:0;}
  .quiz-step{display:none; flex-direction:column; gap:20px;}
  .quiz-step.active{display:flex; animation:fadeUp .35s var(--ease) both;}
  .quiz-sub{color:var(--text-muted); font-size:14px; margin-top:6px;}
  .quiz-footer{margin-top:auto; padding-top:24px; display:flex; flex-direction:column; gap:12px;}
  .selected-summary{
    font-size:12.5px; color:var(--text-faint); text-align:center;
    font-family:var(--font-mono); min-height:18px;
  }
</style>
</head>
<body>
  <div class="quiz-shell">
    <div class="quiz-head">
      <button class="icon-btn" id="backBtn"></button>
      <span class="step-label" id="stepLabel">Шаг 1 из 2</span>
      <span style="width:42px"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:50%"></div></div>

    <div class="quiz-step active" data-step="1">
      <div>
        <h1>Какая у тебя кожа?</h1>
        <p class="quiz-sub">Можно выбрать несколько — например, жирная и чувствительная одновременно. Это нормально, и подбор это учтёт.</p>
      </div>
      <div class="options" id="skinTypeOptions"></div>
    </div>

    <div class="quiz-step" data-step="2">
      <div>
        <h1>Что беспокоит?</h1>
        <p class="quiz-sub">Отметь всё, что актуально — по этому подберём активные компоненты.</p>
      </div>
      <div class="options" id="concernOptions"></div>
    </div>

    <div class="quiz-footer">
      <div class="selected-summary" id="summary"></div>
      <button class="btn-primary" id="nextBtn" disabled>ДАЛЕЕ</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let step = 1;
    const isEdit = new URLSearchParams(location.search).get("edit") === "1";
    // в режиме правки подставляем текущие ответы, чтобы не выбирать всё заново
    const saved = isEdit ? Store.getQuiz() : null;
    const state = {
      skin_types: saved?.skin_types ? [...saved.skin_types] : [],
      concerns: saved?.concerns ? [...saved.concerns] : [],
    };
    let meta = { skin_types: [], concerns: [] };

    document.getElementById("backBtn").innerHTML = svg("back", 19);
    document.getElementById("backBtn").onclick = prevStep;

    function updateHead() {
      document.getElementById("stepLabel").textContent = `Шаг ${step} из 2`;
      document.getElementById("progressFill").style.width = step === 1 ? "50%" : "100%";
      document.querySelectorAll(".quiz-step").forEach(s =>
        s.classList.toggle("active", Number(s.dataset.step) === step));
      updateFooter();
    }

    function updateFooter() {
      const btn = document.getElementById("nextBtn");
      const summary = document.getElementById("summary");
      if (step === 1) {
        btn.disabled = state.skin_types.length === 0;
        btn.textContent = "ДАЛЕЕ";
        const labels = state.skin_types
          .map(id => meta.skin_types.find(o => o.id === id)?.label)
          .filter(Boolean);
        summary.textContent = labels.length ? `Выбрано: ${labels.join(" + ")}` : "Выбери хотя бы один вариант";
      } else {
        btn.disabled = false;
        btn.textContent = "К БЮДЖЕТУ";
        summary.textContent = state.concerns.length
          ? `Отмечено: ${state.concerns.length}`
          : "Можно пропустить, если ничего не беспокоит";
      }
    }

    function prevStep() {
      if (step === 1) { window.location.href = isEdit ? "profile.html" : "index.html"; return; }
      step = 1; updateHead();
    }

    document.getElementById("nextBtn").onclick = () => {
      if (step === 1) { step = 2; updateHead(); return; }
      Store.setQuiz(state);
      window.location.href = isEdit ? "budget.html?edit=1" : "budget.html";
    };

    function toggle(listName, id, el) {
      const list = state[listName];
      const idx = list.indexOf(id);
      if (idx >= 0) list.splice(idx, 1); else list.push(id);
      el.classList.toggle("selected");
      updateFooter();
    }

    api("/api/meta/options").then(data => {
      meta = data;
      document.getElementById("skinTypeOptions").innerHTML = data.skin_types.map(o => `
        <div class="option-card" data-id="${o.id}">
          <div><div class="opt-name">${o.label}</div><div class="opt-sub">${o.hint}</div></div>
          <div class="tick">✓</div>
        </div>`).join("");

      document.getElementById("concernOptions").innerHTML = data.concerns.map(o => `
        <div class="option-card" data-id="${o.id}">
          <div class="opt-name">${o.label}</div>
          <div class="tick">✓</div>
        </div>`).join("");

      document.querySelectorAll("#skinTypeOptions .option-card").forEach(el => {
        if (state.skin_types.includes(el.dataset.id)) el.classList.add("selected");
        el.onclick = () => toggle("skin_types", el.dataset.id, el);
      });
      document.querySelectorAll("#concernOptions .option-card").forEach(el => {
        if (state.concerns.includes(el.dataset.id)) el.classList.add("selected");
        el.onclick = () => toggle("concerns", el.dataset.id, el);
      });

      updateFooter();
    }).catch(err => {
      document.querySelector(".quiz-shell").innerHTML =
        `<p class="error-text">Не удалось загрузить квиз: ${err.message}. Backend запущен?</p>`;
    });
  </script>
</body>
</html>
