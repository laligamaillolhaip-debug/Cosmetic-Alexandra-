<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — товар</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .product-page{max-width:680px; margin:0 auto; padding:20px 22px 40px; display:flex; flex-direction:column; gap:24px;}
  #content{display:flex; flex-direction:column; gap:26px;}
  .product-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .hero-visual{
    height:230px; border-radius:var(--r-xl);
    background:
      radial-gradient(420px 220px at 50% 0%, rgba(59,158,255,0.22), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
  }
  .title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
  .actives-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .cta-stack{display:flex; flex-direction:column; gap:11px;}
</style>
</head>
<body>
  <div class="product-page">
    <div class="product-head">
      <button class="icon-btn" id="backBtn"></button>
      <button class="icon-btn" id="favBtn" title="В избранное"></button>
    </div>
    <div id="content" class="loading">Загрузка...</div>
  </div>

  <nav id="appnav" class="appnav"></nav>

  <script src="js/api.js"></script>
  <script>
    const profileId = requireProfile();
    renderNav("catalog.html");
    const productId = new URLSearchParams(location.search).get("id");

    document.getElementById("backBtn").innerHTML = svg("back", 19);
    document.getElementById("backBtn").onclick = () => history.back();

    const favBtn = document.getElementById("favBtn");
    favBtn.innerHTML = svg("heart", 19);
    favBtn.onclick = async () => {
      const active = await Favorites.toggle(profileId, productId);
      favBtn.classList.toggle("fav-active", active);
    };

    function render({ product: p, prices, category_label }) {
      document.getElementById("content").classList.remove("loading");
      document.getElementById("content").innerHTML = `
        <div class="hero-visual">${svg(p.icon, 76)}</div>

        <div class="title-row">
          <div>
            <span class="eyebrow">${category_label}</span>
            <h1 style="font-size:24px; margin-top:8px;">${p.name}</h1>
            <div class="product-brand" style="font-size:13.5px; margin-top:6px;">${p.brand} · ${p.volume_ml} мл</div>
          </div>
        </div>

        <div>
          <div class="section-title"><h3>Цена по магазинам</h3><span>${prices.length} источника</span></div>
          <div class="compare-table">
            ${prices.map((pr, i) => `
              <div class="compare-row ${i === 0 ? "best" : ""}">
                <span class="compare-shop">
                  ${pr.url ? `<a href="${pr.url}" target="_blank" rel="noopener nofollow">${pr.shop_name}</a>` : pr.shop_name}
                  ${i === 0 ? '<span class="best-tag">выгоднее</span>' : ""}
                  ${sourceTag(pr)}
                </span>
                <span class="compare-price ${sourceInfo(pr).cls}">${fmtPrice(pr.price)}</span>
              </div>`).join("")}
          </div>
        </div>

        <div>
          <div class="section-title"><h3>Состав и действие</h3></div>
          <div class="actives-row">
            ${p.actives.map(a => `<span class="ingredient-tag">${a.name}</span>`).join("")}
          </div>
          <p style="font-size:14px; color:var(--text-muted); line-height:1.65;">${p.description}</p>
        </div>

        <div id="aiSlot"></div>

        <div class="cta-stack">
          <button class="btn-ghost" id="askAiBtn">${svg("sparkle", 17)}Спросить ИИ: нужен ли мне этот продукт?</button>
          <div style="display:flex; gap:11px;">
            <button class="btn-primary" data-add-tod="morning">В утренний план</button>
            <button class="btn-primary" data-add-tod="evening">В вечерний план</button>
          </div>
        </div>`;

      document.querySelectorAll("[data-add-tod]").forEach(btn => {
        btn.onclick = async () => {
          const original = btn.textContent;
          btn.disabled = true;
          await api(`/api/plan/${profileId}/items`, {
            method: "POST",
            body: JSON.stringify({ product_id: productId, time_of_day: btn.dataset.addTod }),
          });
          btn.textContent = "Добавлено ✓";
          setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1600);
        };
      });

      document.getElementById("askAiBtn").onclick = async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        const slot = document.getElementById("aiSlot");
        slot.innerHTML = `<div class="ai-block"><div class="ai-label">${svg("sparkle", 14)}Ответ ИИ</div><div id="thinkSlot"></div></div>`;
        const stopThinking = showThinking(document.getElementById("thinkSlot"), "Сверяю продукт с твоим планом");
        try {
          const { advice } = await api(`/api/products/${productId}/ai-advice`, {
            method: "POST",
            body: JSON.stringify({ profile_id: profileId }),
          });
          stopThinking();
          slot.innerHTML = `<div class="ai-block fade-in"><div class="ai-label">${svg("sparkle", 14)}Ответ ИИ</div><p></p></div>`;
          slot.querySelector("p").textContent = advice;
        } catch (err) {
          stopThinking();
          slot.innerHTML = `<div class="ai-block muted fade-in"><div class="ai-label">ИИ недоступен</div><p></p></div>`;
          slot.querySelector("p").textContent = err.message;
        }
        btn.disabled = false;
      };
    }
  </script>
</body>
</html>
