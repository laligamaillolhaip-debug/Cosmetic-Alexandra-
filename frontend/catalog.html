<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — каталог</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/editorial.css">
<style>
  .filters{display:flex; flex-direction:column; gap:14px; margin-bottom:26px;}
  .catalog-card{position:relative;}
  .catalog-card .fav-corner{position:absolute; top:12px; right:12px;}
  .catalog-card .product-card{padding-right:58px;}
</style>
</head>
<body class="editorial-page catalog-page">
  <div id="topbar" class="topbar"></div>

  <div class="container">
    <header class="editorial-hero"><p class="editorial-label"><span>03 /</span> Средства и составы</p><h1>Найди своё средство<span>.</span></h1><div class="hero-bottom"><p>Сравнивай цены. Выбирай то, что нужно коже.</p><span class="catalog-total" id="catalogTotal" aria-live="polite">Загружаем каталог</span></div></header>

    <div class="filters">
      <div class="search-bar">
        <span id="searchIcon"></span>
        <input type="text" id="searchInput" placeholder="Поиск средства или бренда">
      </div>
      <div class="chip-row no-scrollbar" id="chipRow"></div>
    </div>

    <div class="source-legend">
      <span>Откуда цена:</span>
      <span class="item"><span class="swatch" style="background:var(--accent)"></span>живая, собрана с магазина</span>
      <span class="item"><span class="swatch" style="background:var(--success)"></span>из партнёрского фида</span>
      <span class="item"><span class="swatch" style="background:var(--text-faint)"></span>референсная по рынку</span>
    </div>

    <div id="results" class="grid-cards"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const profileId = requireProfile();
    renderTopbar("catalog.html");
    document.getElementById("searchIcon").innerHTML = svg("search", 18);

    let categories = [];
    let activeCategory = "";
    let inBudget = true;

    function buildChips() {
      const budget = Store.getBudget();
      const chips = [
        { key: "__budget", label: `До ${fmtPrice(budget)} за средство`, active: inBudget },
        ...categories.map(([id, label]) => ({ key: id, label, active: activeCategory === id })),
      ];
      document.getElementById("chipRow").innerHTML = chips.map(c =>
        `<button class="filter-chip ${c.active ? "active" : ""}" data-key="${c.key}">${c.label}</button>`).join("");
      document.querySelectorAll(".filter-chip").forEach(btn => {
        btn.onclick = () => {
          const key = btn.dataset.key;
          if (key === "__budget") inBudget = !inBudget;
          else activeCategory = activeCategory === key ? "" : key;
          buildChips();
          load();
        };
      });
    }

    async function load() {
      const params = new URLSearchParams();
      const q = document.getElementById("searchInput").value.trim();
      if (q) params.set("query", q);
      if (activeCategory) params.set("category", activeCategory);
      if (inBudget) params.set("max_price", Store.getBudget() || 999999);

      const results = document.getElementById("results");
      results.innerHTML = Array.from({ length: 3 }, () => `<div class="skeleton"></div>`).join("");

      const data = await api(`/api/products?${params.toString()}`);
      document.getElementById("catalogTotal").textContent = `Найдено: ${data.items.length}`;
      if (!categories.length) { categories = data.categories; buildChips(); }

      if (!data.items.length) {
        results.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Ничего не нашлось. Попробуй снять фильтр бюджета или другую категорию.</div>`;
        return;
      }

      results.innerHTML = data.items.map(({ product, cheapest, shop_count, category_label }) => `
        <div class="catalog-card fade-in">
          <a class="product-card" href="product.html?id=${product.id}">
            <div class="catalog-card-head"><span class="editorial-label">${category_label}</span><div class="thumb">${svg(product.icon, 28)}</div></div>
            <div class="product-info">
              <div class="product-name">${product.name}</div>
              <div class="product-brand">${product.brand}${product.volume_ml ? ` · ${product.volume_ml} мл` : ""}</div>
              <div class="product-meta">
                <span class="price-shop">${cheapest.shop_name}${shop_count > 1 ? ` · ещё ${shop_count - 1}` : ""} ${sourceTag(cheapest)}</span>
                ${priceHtml(cheapest)}
              </div>
            </div>
          </a>
          <button class="icon-btn fav-corner ${Favorites.has(product.id) ? "fav-active" : ""}"
            data-fav="${product.id}" aria-label="В избранное" aria-pressed="${Favorites.has(product.id)}" title="В избранное">${svg("heart", 18)}</button>
        </div>`).join("");

      results.querySelectorAll("[data-fav]").forEach(btn => {
        btn.onclick = async () => {
          const active = await Favorites.toggle(profileId, btn.dataset.fav);
          btn.classList.toggle("fav-active", active);
          btn.setAttribute("aria-pressed", String(active));
        };
      });
    }

    let debounce;
    document.getElementById("searchInput").oninput = () => {
      clearTimeout(debounce);
      debounce = setTimeout(load, 250);
    };

    Promise.all([Favorites.load(profileId), api(`/api/profile/${profileId}`).then(p => Store.setBudget(p.budget_month))])
      .then(load)
      .catch(err => {
        document.getElementById("results").innerHTML = `<p class="error-text">${err.message}</p>`;
      });
  </script>
</body>
</html>
