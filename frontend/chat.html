<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — ассистент</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .chat-shell{
    max-width:720px; margin:0 auto; padding:0 22px 10px;
    display:flex; flex-direction:column;
    height:calc(100dvh - 330px); min-height:320px;
  }
  #chatArea{flex:1; overflow-y:auto; padding:6px 4px 10px;}
  @media (min-width:900px){ .chat-shell{height:calc(100dvh - 240px);} }
</style>
</head>
<body>
  <div id="topbar" class="topbar"></div>

  <div class="container">
    <div class="page-head" style="padding-bottom:14px;">
      <span class="eyebrow">Знает твой профиль и план</span>
      <h1>ИИ-ассистент</h1>
    </div>
  </div>

  <div class="chat-shell">
    <div id="chatArea" class="chat-area"></div>
    <div class="chip-row no-scrollbar" id="suggestRow" style="margin-top:10px;"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Спросить об уходе...">
      <button class="send-btn" id="sendBtn"></button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const profileId = requireProfile();
    renderTopbar("chat.html");
    document.getElementById("sendBtn").innerHTML = svg("send", 19);

    function appendMsg(role, text) {
      const area = document.getElementById("chatArea");
      const div = document.createElement("div");
      div.className = `msg ${role === "user" ? "me" : "ai"} fade-in`;
      div.textContent = text;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      const input = document.getElementById("chatInput");
      const value = (text ?? input.value).trim();
      if (!value) return;
      input.value = "";
      appendMsg("user", value);
      const pending = appendMsg("assistant", "");
      const stopThinking = showThinking(pending, "Модель думает");
      try {
        const { reply } = await api(`/api/chat/${profileId}`, {
          method: "POST",
          body: JSON.stringify({ message: value }),
        });
        stopThinking();
        pending.textContent = reply;
      } catch (err) {
        stopThinking();
        pending.textContent = "ИИ недоступен: " + err.message;
      }
      document.getElementById("chatArea").scrollTop = document.getElementById("chatArea").scrollHeight;
    }

</script>
</body>
</html>
