<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ядро — вход</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{padding-bottom:0;}
  .auth-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
  .auth-card{
    width:100%; max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--border); border-radius:var(--r-xl);
    padding:32px 28px; box-shadow:var(--shadow-lg);
    display:flex; flex-direction:column; gap:20px;
  }
  .auth-card h1{font-size:25px;}
  .auth-sub{color:var(--text-muted); font-size:14px; margin-top:6px;}
  .tabs{display:flex; gap:4px; padding:5px; background:rgba(255,255,255,0.05);
        border:1px solid var(--border); border-radius:var(--r-full);}
  .tab{
    flex:1; border:none; background:transparent; color:var(--text-faint);
    font-family:var(--font-display); font-weight:700; font-size:14px;
    padding:11px; border-radius:var(--r-full); transition:all .2s var(--ease);
  }
  .tab.active{background:var(--gradient); color:#04121F; box-shadow:var(--shadow-accent);}
  .field{display:flex; flex-direction:column; gap:8px;}
  .field label{font-size:12px; font-weight:700; color:var(--text-faint);
               text-transform:uppercase; letter-spacing:0.07em;}
  .field input{
    background:rgba(255,255,255,0.04); border:1px solid var(--border);
    border-radius:var(--r-md); padding:14px 16px; color:var(--text);
    font-family:inherit; font-size:15px; outline:none; transition:all .2s var(--ease);
  }
  .field input:focus{border-color:rgba(59,158,255,0.45); box-shadow:0 0 0 4px rgba(59,158,255,0.08);}
  .hint{font-size:12px; color:var(--text-faint);}
  .msg{font-size:13.5px; padding:12px 14px; border-radius:var(--r-md); display:none;}
  .msg.error{display:block; background:rgba(251,191,36,0.12); color:var(--warning);
             border:1px solid rgba(251,191,36,0.3);}
</style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card fade-in">
      <div>
        <div class="wordmark" style="margin-bottom:18px;">
          <span class="mark">Я</span><span class="name">ЯДРО</span>
        </div>
        <h1 id="title">Вход в аккаунт</h1>
        <p class="auth-sub" id="subtitle">Чтобы план ухода сохранялся и был доступен с любого устройства.</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-mode="login">Вход</button>
        <button class="tab" data-mode="register">Регистрация</button>
      </div>

      <div class="msg" id="msg"></div>

      <form id="form" style="display:flex; flex-direction:column; gap:16px;">
        <div class="field">
          <label for="email">Почта</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@mail.ru" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input type="password" id="password" autocomplete="current-password"
                 placeholder="не короче 6 символов" required>
          <span class="hint" id="hint">Пароль хранится только в виде хэша — восстановить его нельзя.</span>
        </div>
        <button class="btn-primary" id="submitBtn" type="submit">ВОЙТИ</button>
      </form>
    </div>
  </div>

</body>
</html>
